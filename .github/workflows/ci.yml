name: ci

on:
  pull_request:
  push:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build linux amd64
        run: GOOS=linux GOARCH=amd64 go build -o dist/nc-guard-linux-amd64 ./cmd/nc-guard

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nc-guard-linux-amd64
          path: dist/nc-guard-linux-amd64
